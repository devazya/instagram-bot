# ============================================================
# Server
# ============================================================
server.port=8080

# ============================================================
# Meta / Instagram credentials
# NEVER commit real values here. In production these should be
# environment variables. Example:
#   set META_VERIFY_TOKEN=yourSecret   (Windows)
#   export META_VERIFY_TOKEN=yourSecret (Mac/Linux)
# The ${VAR:default} syntax below reads from env var first,
# falls back to the placeholder if not set.
# ============================================================

# The custom "password" you type into the Meta Webhooks dashboard.
meta.verify-token=${META_VERIFY_TOKEN:CHANGE_ME_VERIFY_TOKEN}

# Long-lived Page Access Token generated from Meta App > Instagram > Access Tokens.
meta.page-access-token=${META_PAGE_ACCESS_TOKEN:CHANGE_ME_PAGE_ACCESS_TOKEN}

# The numeric Instagram-linked Facebook Page ID (used in the /{page_id}/messages call).
meta.page-id=${META_PAGE_ID:CHANGE_ME_PAGE_ID}

# Graph API version — bump this as Meta deprecates old versions.
meta.graph-api-version=v19.0

# Comma-separated trigger keywords (case-insensitive) that fire the private reply.
meta.trigger-keywords=${META_TRIGGER_KEYWORDS:LINK,SETUP}

# The message text sent back to the commenter.
meta.reply-message=Here is the link you requested: https://example.com

# ============================================================
# Logging (see logback.xml for file/console pattern)
# ============================================================
logging.level.root=INFO
logging.level.com.instabot=DEBUG
